commons:
  security:
    oauth2:
      # Development-only private JWKS on the test classpath (see docs/adr/0018).
      jwks:
      - classpath:jwks.json
management:
  server:
    port: 0
server:
  ssl:
    enabled: false
  servlet:
    session:
      cookie:
        # Plain HTTP: a __Host- cookie must be Secure, so the prefix is dropped too.
        name: id
        secure: false
logging:
  structured:
    ecs:
      service:
        environment: test
spring:
  cloud:
    aws:
      secretsmanager:
        # The development JWKS is a file, so no AWS Secrets Manager client is needed.
        enabled: false
  liquibase:
    # Applies the development seed users in 004-development-seed.sql (see docs/adr/0018).
    contexts: dev
