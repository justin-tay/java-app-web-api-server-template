# The order is the only order: the schemas come from the modules' own changelogs, then this
# application's reference data and development fixtures. New changesets are appended to the
# file they belong to, or in a file of their own included last; file names carry no sequence.
databaseChangeLog:
  - include:
      file: com/example/commons/session/jdbc/schema.yaml
  - include:
      file: com/example/commons/session/oidc/jdbc/schema.yaml
  - include:
      file: com/example/commons/audit/jdbc/schema.yaml
  - include:
      file: com/example/commons/accounts/jdbc/schema.yaml
  - include:
      file: db/changelog/reference-data.sql
  - include:
      file: db/changelog/development-seed.sql
