commons:
  accounts:
    review:
      # Local-only: creates the account review shortly after startup, not an hour later, so the
      # sample accounts in development-seed.sql can be reviewed at once.
      check-interval: PT30S
  security:
    oauth2:
      # Development-only private JWKS; production supplies its own (see docs/adr/0018).
      jwks:
      - file:src/test/resources/jwks.json
    passkeys:
      # Local-only: lets the frontend template's account security page register and
      # manage passkeys (see docs/adr/0024). The origin is the frontend dev server's, not
      # this server's own, since that is where the WebAuthn ceremony runs in the browser.
      enabled: true
      relying-party:
        id: localhost
        name: java-app-web-api-server
      allowed-origins:
      - http://localhost:5173
server:
  ssl:
    enabled: false
  servlet:
    session:
      cookie:
        # Plain HTTP: a __Host- cookie must be Secure, so the prefix is dropped too.
        name: id
        secure: false
logging:
  structured:
    ecs:
      service:
        environment: local
spring:
  liquibase:
    # Applies the development seed users in development-seed.sql (see docs/adr/0018), and
    # the sample accounts to review in the same file.
    contexts: dev,demo
