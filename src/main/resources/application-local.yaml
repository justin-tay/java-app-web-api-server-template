app:
  # Development-only private JWKS; production supplies its own (see docs/adr/0018).
  jwks: file:src/test/resources/jwks.json
server:
  ssl:
    enabled: false
  servlet:
    session:
      cookie:
        secure: false
logging:
  structured:
    ecs:
      service:
        environment: local
spring:
  liquibase:
    # Applies the development seed users in 004-development-seed.sql (see docs/adr/0018).
    contexts: dev
