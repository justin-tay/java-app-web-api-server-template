app:
  # No default for app.jwks: every deployment must supply the location of its own
  # private JWKS, and startup fails if it is unset. See docs/adr/0018.
  session:
    absolute-timeout: 12h
management:
  server:
    # Separate port so the ALB/monitoring health check never shares a listener
    # with the application. Deployments must restrict this port to the
    # health-check and internal ops network only; see docs/adr/0014.
    port: 8082
  endpoints:
    web:
      # Avoid the well-known /actuator prefix so an unauthenticated probe does
      # not immediately fingerprint the framework; see docs/adr/0014.
      base-path: /app
      exposure:
        # Only health is exposed. Adding any other endpoint (metrics, info,
        # etc.) requires adding authentication for the management port first;
        # see docs/adr/0014.
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  tracing:
    sampling:
      # No exporter is configured, so nothing is sent anywhere and 100%
      # sampling has no export-volume cost; it only guarantees every log
      # line carries trace.id/span.id. See docs/adr/0011.
      probability: 1.0
logging:
  structured:
    ecs:
      service:
        environment: production
    format:
      console: ecs
    json:
      # Renames Micrometer Tracing's traceId/spanId MDC keys to ECS's trace.id/
      # span.id field names; see docs/adr/0011.
      customizer:
      - com.example.app.web.server.logging.TraceCorrelationJsonMembersCustomizer
server:
  port: 8081
  servlet:
    session:
      cookie:
        name: id
        http-only: true
        same-site: lax
        secure: true
      tracking-modes:
      - COOKIE
      timeout: 15m
  ssl:
    bundle: server
    enabled-protocols:
    - TLSv1.2
    - TLSv1.3
    ciphers:
    - TLS_AES_256_GCM_SHA384
    - TLS_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_DHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_DHE_RSA_WITH_AES_128_GCM_SHA256
spring:
  application:
    name: java-app-web-api-server
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  main:
    banner-mode: "off"
  session:
    jdbc:
      initialize-schema: never
  ssl:
    bundle:
      pem:
        server:
          keystore:
            certificate: ${CERTIFICATE_PEM:}
            private-key: ${PRIVATE_KEY_PEM:}
          truststore:
            certificate: ${CA_BUNDLE_PEM:}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: java-app-web-api-server
            client-authentication-method: private_key_jwt
            authorization-grant-type: authorization_code
            scope:
            - openid
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/test
            user-name-attribute: preferred_username
