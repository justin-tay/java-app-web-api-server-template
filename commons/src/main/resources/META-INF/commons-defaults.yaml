# commons configuration defaults, contributed below every application configuration
# source by CommonsDefaultsEnvironmentPostProcessor. An application overrides any key
# by setting it in its own application.yaml, a profile, or the environment.
management:
  server:
    # Separate port so the ALB/monitoring health check never shares a listener
    # with the application. Deployments must restrict this port to the
    # health-check and internal ops network only; see docs/adr/0014.
    port: 8082
  endpoints:
    web:
      # Avoid the well-known /actuator prefix so an unauthenticated probe does
      # not immediately fingerprint the framework; see docs/adr/0014.
      base-path: /app
      exposure:
        # Only health is exposed. Adding any other endpoint (metrics, info,
        # etc.) requires adding authentication for the management port first;
        # see docs/adr/0014.
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # Liveness and readiness groups at /app/health/liveness and
      # /app/health/readiness on the management port. A private_key_jwt application
      # also has the jwks contributor in its readiness group, so it is not ready until
      # its JWKS has a signing key (see docs/adr/0020); an application with an
      # issuer-uri has the oidcDiscovery contributor, so it is not ready until its
      # OpenID Provider has been reached once (see docs/adr/0029).
      probes:
        enabled: true
  tracing:
    sampling:
      # No exporter is configured, so nothing is sent anywhere and 100%
      # sampling has no export-volume cost; it only guarantees every log
      # line carries trace.id/span.id. See docs/adr/0011.
      probability: 1.0
logging:
  structured:
    ecs:
      service:
        environment: production
    format:
      console: ecs
    json:
      # Renames Micrometer Tracing's traceId/spanId MDC keys to ECS's trace.id/
      # span.id field names; see docs/adr/0011.
      customizer:
      - com.example.commons.logging.TraceCorrelationJsonMembersCustomizer
commons:
  security:
    session:
      # Maximum lifetime of a session from its creation, regardless of activity.
      absolute-timeout: 12h
      # Invalidates the session if its bound User-Agent changes; see docs/adr/0026.
      hijacking-protection: true
      # Logs an anomaly if the session's bound client IP changes; never invalidates
      # the session. Silently inactive unless a trusted ClientIpResolver is
      # configured; see docs/adr/0026.
      anomaly-detection: true
    logout:
      # Directives for the Clear-Site-Data header sent on logout over HTTPS: cookies,
      # cache, storage, execution-contexts. Empty because cookies also clears the
      # cookies of sibling subdomains, cache costs performance and storage destroys
      # data such as IndexedDB.
      clear-site-data: []
server:
  servlet:
    session:
      cookie:
        # The __Host- prefix makes the browser refuse the cookie unless it is Secure,
        # has Path=/, and has no Domain, so no other host or path can set or shadow it.
        # It requires the application at the root context path. A profile that sets
        # secure: false must also drop the prefix; see application-local.yaml.
        name: __Host-id
        http-only: true
        same-site: lax
        secure: true
      tracking-modes:
      - COOKIE
      timeout: 15m
  ssl:
    # Only the protocols and cipher suites are defaulted here. Each application
    # still supplies its own certificate through server.ssl.bundle, or sets
    # server.ssl.enabled=false for a profile that runs without TLS.
    enabled-protocols:
    - TLSv1.2
    - TLSv1.3
    ciphers:
    - TLS_AES_256_GCM_SHA384
    - TLS_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_DHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_DHE_RSA_WITH_AES_128_GCM_SHA256
spring:
  session:
    jdbc:
      # Liquibase owns the schema (see docs/adr/0004); commons ships the Spring
      # Session tables as db/changelog/003-spring-session-schema.sql for each
      # application's master changelog to include.
      initialize-schema: never
