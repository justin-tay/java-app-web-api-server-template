# The commons-accounts schema, written once in Liquibase change types so that each type is
# translated for the target database (H2, PostgreSQL and SQL Server). An application's master
# changelog includes this file; it ships no application data apart from the default settings.
#
# Every entity has two identifiers (docs/adr/0036): id, a bigint primary key from a sequence, and
# public_id, a UUID in the database's UUID type that the application generates as a random
# version 4 value and that the API, the audit trail and the logs use. The sequences step by 50,
# which is what Hibernate's default sequence generator expects, and start at 1000, so an
# application can seed rows with fixed ids below 900, as the default settings do. A setting has
# no public_id, because nothing addresses a setting by id; its name is unique. An instant is
# held in a time zone aware column, which is what Hibernate expects of a Java Instant and does
# not depend on the session time zone; the exception is the passkey tables, whose timestamps
# are Spring Security's own.
# The binary type differs by database: Liquibase's generic blob type is a large object on
# PostgreSQL, where Spring expects bytea.
databaseChangeLog:
  # The type of an instant, and the current instant, per database: Liquibase turns a time zone
  # aware timestamp into a plain datetime2 on SQL Server, where datetimeoffset is wanted.
  - property: { name: instant.type, value: "TIMESTAMP WITH TIME ZONE", dbms: "h2,postgresql" }
  - property: { name: instant.type, value: "DATETIMEOFFSET(7)", dbms: mssql }
  - property: { name: instant.now, value: CURRENT_TIMESTAMP, dbms: "h2,postgresql" }
  - property: { name: instant.now, value: SYSDATETIMEOFFSET(), dbms: mssql }
  - property: { name: binary.type, value: LONGVARBINARY, dbms: h2 }
  - property: { name: binary.type, value: BYTEA, dbms: postgresql }
  - property: { name: binary.type, value: "VARBINARY(MAX)", dbms: mssql }
  - changeSet:
      id: accounts-schema
      author: commons-accounts
      changes:
        # One sequence per table, named as Hibernate names the sequence of an entity.
        - createSequence: { sequenceName: app_user_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: app_group_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: app_role_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: account_audit_event_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: app_setting_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: task_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: account_review_item_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: account_review_attestation_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: account_review_population_entry_seq, startValue: 1000, incrementBy: 50 }
        - createSequence: { sequenceName: account_review_report_seq, startValue: 1000, incrementBy: 50 }

        # Users, groups and roles, and the join tables between them.
        - createTable:
            tableName: app_user
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_app_user } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_user_public_id } }
              - column: { name: username, type: varchar(100), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_user_username } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: email, type: varchar(254) }
              # An optional free-text label that the account review shows and filters by.
              - column: { name: department, type: varchar(100) }
              # An account is active or suspended, and records when and why it was suspended.
              # The inactivity clock restarts when an account is created or unsuspended. See
              # docs/adr/0031.
              - column: { name: status, type: varchar(20), defaultValue: ACTIVE, constraints: { nullable: false } }
              - column: { name: suspended_at, type: "${instant.type}" }
              - column: { name: suspension_reason_code, type: varchar(40) }
              - column: { name: suspension_note, type: varchar(200) }
              - column: { name: inactivity_clock_started_at, type: "${instant.type}", defaultValueComputed: "${instant.now}", constraints: { nullable: false } }
              # When the user last signed in, by OIDC or passkey. Null until the first sign-in.
              - column: { name: last_login_at, type: "${instant.type}" }
              - column: { name: created_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: updated_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(100), constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(100), constraints: { nullable: false } }
        - createIndex: { tableName: app_user, indexName: ix_app_user_department, columns: [ { column: { name: department } } ] }
        - createTable:
            tableName: app_group
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_app_group } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_group_public_id } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_group_name } }
              - column: { name: created_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: updated_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(100), constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(100), constraints: { nullable: false } }
        # A role's name is the stable authority; its display name is the label clients show.
        - createTable:
            tableName: app_role
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_app_role } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_role_public_id } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_role_name } }
              - column: { name: display_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: created_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: updated_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: created_by, type: varchar(100), constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(100), constraints: { nullable: false } }
        - createTable:
            tableName: app_user_group
            columns:
              - column: { name: user_id, type: bigint, constraints: { nullable: false } }
              - column: { name: group_id, type: bigint, constraints: { nullable: false } }
        - addPrimaryKey: { tableName: app_user_group, columnNames: "user_id, group_id", constraintName: pk_app_user_group }
        - addForeignKeyConstraint: { baseTableName: app_user_group, baseColumnNames: user_id, constraintName: fk_app_user_group_user, referencedTableName: app_user, referencedColumnNames: id }
        - addForeignKeyConstraint: { baseTableName: app_user_group, baseColumnNames: group_id, constraintName: fk_app_user_group_group, referencedTableName: app_group, referencedColumnNames: id }
        - createTable:
            tableName: app_group_role
            columns:
              - column: { name: group_id, type: bigint, constraints: { nullable: false } }
              - column: { name: role_id, type: bigint, constraints: { nullable: false } }
        - addPrimaryKey: { tableName: app_group_role, columnNames: "group_id, role_id", constraintName: pk_app_group_role }
        - addForeignKeyConstraint: { baseTableName: app_group_role, baseColumnNames: group_id, constraintName: fk_app_group_role_group, referencedTableName: app_group, referencedColumnNames: id }
        - addForeignKeyConstraint: { baseTableName: app_group_role, baseColumnNames: role_id, constraintName: fk_app_group_role_role, referencedTableName: app_role, referencedColumnNames: id }
        - createIndex: { tableName: app_user_group, indexName: ix_app_user_group_group, columns: [ { column: { name: group_id } } ] }
        - createIndex: { tableName: app_group_role, indexName: ix_app_group_role_role, columns: [ { column: { name: role_id } } ] }

        # Storage for Spring Security's JdbcPublicKeyCredentialUserEntityRepository and
        # JdbcUserCredentialRepository, with the table and column names they expect. The user
        # entity id is the base64url form of the app_user id (its 16 UUID bytes), which is the
        # WebAuthn user handle, so there is no foreign key to app_user: deleting a user must
        # also delete their user_entities row, which then cascades to their credentials.
        - createTable:
            tableName: user_entities
            columns:
              - column: { name: id, type: varchar(1000), constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_user_entities } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_user_entities_name } }
              - column: { name: display_name, type: varchar(200) }
        - createTable:
            tableName: user_credentials
            columns:
              - column: { name: credential_id, type: varchar(1000), constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_user_credentials } }
              - column: { name: user_entity_user_id, type: varchar(1000), constraints: { nullable: false } }
              - column: { name: public_key, type: "${binary.type}", constraints: { nullable: false } }
              - column: { name: signature_count, type: bigint }
              - column: { name: uv_initialized, type: boolean }
              - column: { name: backup_eligible, type: boolean, constraints: { nullable: false } }
              - column: { name: authenticator_transports, type: varchar(1000) }
              - column: { name: public_key_credential_type, type: varchar(100) }
              - column: { name: backup_state, type: boolean, constraints: { nullable: false } }
              - column: { name: attestation_object, type: "${binary.type}" }
              - column: { name: attestation_client_data_json, type: "${binary.type}" }
              - column: { name: created, type: timestamp }
              - column: { name: last_used, type: timestamp }
              - column: { name: label, type: varchar(1000), constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: user_credentials, baseColumnNames: user_entity_user_id, constraintName: fk_user_credentials_user, referencedTableName: user_entities, referencedColumnNames: id, onDelete: CASCADE }
        - createIndex: { tableName: user_credentials, indexName: ix_user_credentials_user, columns: [ { column: { name: user_entity_user_id } } ] }

        # The business audit trail. It has no foreign key to app_user, so an event outlives the
        # account it records. See docs/adr/0030.
        - createTable:
            tableName: account_audit_event
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_account_audit_event } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_account_audit_event_public_id } }
              - column: { name: occurred_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: actor, type: varchar(100), constraints: { nullable: false } }
              - column: { name: action, type: varchar(50), constraints: { nullable: false } }
              - column: { name: target_type, type: varchar(20), constraints: { nullable: false } }
              - column: { name: target_id, type: varchar(100) }
              - column: { name: target_name, type: varchar(100) }
              - column: { name: target_full_name, type: varchar(100) }
              - column: { name: reason_code, type: varchar(40) }
              - column: { name: reason_note, type: varchar(200) }
              - column: { name: details, type: clob }
        - createIndex: { tableName: account_audit_event, indexName: ix_account_audit_event_occurred, columns: [ { column: { name: occurred_at } } ] }
        - createIndex: { tableName: account_audit_event, indexName: ix_account_audit_event_actor, columns: [ { column: { name: actor } } ] }
        - createIndex: { tableName: account_audit_event, indexName: ix_account_audit_event_target, columns: [ { column: { name: target_type } }, { column: { name: target_name } } ] }
        - createIndex: { tableName: account_audit_event, indexName: ix_account_audit_event_action, columns: [ { column: { name: action } } ] }

        # Application settings, edited by a settings administrator.
        - createTable:
            tableName: app_setting
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_app_setting } }
              - column: { name: name, type: varchar(100), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_app_setting_name } }
              - column: { name: setting_value, type: varchar(100), constraints: { nullable: false } }
              - column: { name: updated_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: updated_by, type: varchar(100), constraints: { nullable: false } }

        # A generic task, with the periodic account review as its first type. The review's rows
        # have no foreign key to app_user, so they outlive a removed account. A pending item is
        # read from the live account; the evidence columns, a confirmed population's entries and
        # the report are frozen when they are written and never change. See docs/adr/0037.
        - createTable:
            tableName: task
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_task } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_task_public_id } }
              - column: { name: type, type: varchar(40), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), constraints: { nullable: false } }
              - column: { name: start_date, type: date, constraints: { nullable: false } }
              - column: { name: due_date, type: date, constraints: { nullable: false } }
              - column: { name: created_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: completed_at, type: "${instant.type}" }
              - column: { name: completed_by, type: varchar(100) }
        - addUniqueConstraint: { tableName: task, columnNames: "type, start_date", constraintName: uk_task_type_start }
        # One active account's entry in a task. The identity is fixed when the task is created. The
        # decision and the evidence columns are null until the item is decided, and groups_after is
        # null for a removal. The removal's reason, note and actor stay in its audit event.
        - createTable:
            tableName: account_review_item
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_account_review_item } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_account_review_item_public_id } }
              - column: { name: task_id, type: bigint, constraints: { nullable: false } }
              - column: { name: user_public_id, type: uuid, constraints: { nullable: false } }
              - column: { name: username, type: varchar(100), constraints: { nullable: false } }
              - column: { name: full_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: outcome, type: varchar(30), constraints: { nullable: false } }
              - column: { name: decided_at, type: "${instant.type}" }
              - column: { name: decided_by, type: varchar(100) }
              - column: { name: removal_audit_event_id, type: bigint }
              - column: { name: department, type: varchar(100) }
              - column: { name: last_login_at, type: "${instant.type}" }
              - column: { name: groups_before, type: clob }
              - column: { name: groups_after, type: clob }
        - addForeignKeyConstraint: { baseTableName: account_review_item, baseColumnNames: task_id, constraintName: fk_account_review_item_task, referencedTableName: task, referencedColumnNames: id }
        - addUniqueConstraint: { tableName: account_review_item, columnNames: "task_id, user_public_id", constraintName: uk_account_review_item_task_user }
        - createIndex: { tableName: account_review_item, indexName: ix_account_review_item_task_outcome, columns: [ { column: { name: task_id } }, { column: { name: outcome } } ] }
        # A reviewer's confirmation of the suspended or the removed population, once per task.
        - createTable:
            tableName: account_review_attestation
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_account_review_attestation } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_account_review_attestation_public_id } }
              - column: { name: task_id, type: bigint, constraints: { nullable: false } }
              - column: { name: population, type: varchar(20), constraints: { nullable: false } }
              - column: { name: confirmed_by, type: varchar(100), constraints: { nullable: false } }
              - column: { name: confirmed_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: note, type: varchar(200) }
              - column: { name: entry_count, type: integer, constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: account_review_attestation, baseColumnNames: task_id, constraintName: fk_account_review_attestation_task, referencedTableName: task, referencedColumnNames: id }
        - addUniqueConstraint: { tableName: account_review_attestation, columnNames: "task_id, population", constraintName: uk_account_review_attestation_task_population }
        # The list of a population as it was when it was confirmed.
        - createTable:
            tableName: account_review_population_entry
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_account_review_population_entry } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_account_review_population_entry_public_id } }
              - column: { name: attestation_id, type: bigint, constraints: { nullable: false } }
              - column: { name: user_public_id, type: uuid, constraints: { nullable: false } }
              - column: { name: username, type: varchar(100), constraints: { nullable: false } }
              - column: { name: full_name, type: varchar(100), constraints: { nullable: false } }
              - column: { name: department, type: varchar(100) }
              - column: { name: last_login_at, type: "${instant.type}" }
              - column: { name: occurred_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: actor, type: varchar(100) }
              - column: { name: reason_code, type: varchar(40) }
              - column: { name: reason_note, type: varchar(200) }
        - addForeignKeyConstraint: { baseTableName: account_review_population_entry, baseColumnNames: attestation_id, constraintName: fk_account_review_population_entry_attestation, referencedTableName: account_review_attestation, referencedColumnNames: id }
        - createIndex: { tableName: account_review_population_entry, indexName: ix_account_review_population_entry_attestation, columns: [ { column: { name: attestation_id } } ] }
        # The PDF stored when a task completes, written once and never changed.
        - createTable:
            tableName: account_review_report
            columns:
              - column: { name: id, type: bigint, constraints: { nullable: false, primaryKey: true, primaryKeyName: pk_account_review_report } }
              - column: { name: public_id, type: uuid, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_account_review_report_public_id } }
              - column: { name: task_id, type: bigint, constraints: { nullable: false, unique: true, uniqueConstraintName: uk_account_review_report_task } }
              - column: { name: content, type: "${binary.type}", constraints: { nullable: false } }
              - column: { name: size_bytes, type: bigint, constraints: { nullable: false } }
              - column: { name: sha256, type: varchar(64), constraints: { nullable: false } }
              - column: { name: generated_at, type: "${instant.type}", constraints: { nullable: false } }
              - column: { name: generated_by, type: varchar(100), constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: account_review_report, baseColumnNames: task_id, constraintName: fk_account_review_report_task, referencedTableName: task, referencedColumnNames: id }

        # Default settings, applied in every environment.
        - insert: { tableName: app_setting, columns: [ { column: { name: id, valueNumeric: 1 } }, { column: { name: name, value: inactivity.enabled } }, { column: { name: setting_value, value: "true" } }, { column: { name: updated_at, valueComputed: "${instant.now}" } }, { column: { name: updated_by, value: system } } ] }
        - insert: { tableName: app_setting, columns: [ { column: { name: id, valueNumeric: 2 } }, { column: { name: name, value: inactivity.suspendAfterDays } }, { column: { name: setting_value, value: "90" } }, { column: { name: updated_at, valueComputed: "${instant.now}" } }, { column: { name: updated_by, value: system } } ] }
        - insert: { tableName: app_setting, columns: [ { column: { name: id, valueNumeric: 3 } }, { column: { name: name, value: inactivity.removeAfterDays } }, { column: { name: setting_value, value: "180" } }, { column: { name: updated_at, valueComputed: "${instant.now}" } }, { column: { name: updated_by, value: system } } ] }
        - insert: { tableName: app_setting, columns: [ { column: { name: id, valueNumeric: 4 } }, { column: { name: name, value: review.enabled } }, { column: { name: setting_value, value: "true" } }, { column: { name: updated_at, valueComputed: "${instant.now}" } }, { column: { name: updated_by, value: system } } ] }
        - insert: { tableName: app_setting, columns: [ { column: { name: id, valueNumeric: 5 } }, { column: { name: name, value: review.intervalMonths } }, { column: { name: setting_value, value: "3" } }, { column: { name: updated_at, valueComputed: "${instant.now}" } }, { column: { name: updated_by, value: system } } ] }
      # The tables in the reverse of their creation order, so a table is dropped before the
      # tables it refers to, then the sequences. This is what schema-drop-<platform>.sql is generated from.
      rollback:
        - dropTable: { tableName: account_review_report }
        - dropTable: { tableName: account_review_population_entry }
        - dropTable: { tableName: account_review_attestation }
        - dropTable: { tableName: account_review_item }
        - dropTable: { tableName: task }
        - dropTable: { tableName: app_setting }
        - dropTable: { tableName: account_audit_event }
        - dropTable: { tableName: user_credentials }
        - dropTable: { tableName: user_entities }
        - dropTable: { tableName: app_group_role }
        - dropTable: { tableName: app_user_group }
        - dropTable: { tableName: app_role }
        - dropTable: { tableName: app_group }
        - dropTable: { tableName: app_user }
        - dropSequence: { sequenceName: account_review_report_seq }
        - dropSequence: { sequenceName: account_review_population_entry_seq }
        - dropSequence: { sequenceName: account_review_attestation_seq }
        - dropSequence: { sequenceName: account_review_item_seq }
        - dropSequence: { sequenceName: app_setting_seq }
        - dropSequence: { sequenceName: task_seq }
        - dropSequence: { sequenceName: account_audit_event_seq }
        - dropSequence: { sequenceName: app_role_seq }
        - dropSequence: { sequenceName: app_group_seq }
        - dropSequence: { sequenceName: app_user_seq }
